name: Build bedROK

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore full loader source
        shell: bash
        run: |
          # Recover last good full loader (before accidental PLACEHOLDER)
          git show 4cfa6a19a13788107927d3559415f7d4cc126111:loader/bedrok_loader.py > loader/bedrok_loader.py
          wc -l loader/bedrok_loader.py

      - name: Patch loader — embed DLL only (no browse)
        shell: pwsh
        run: |
          $p = "loader/bedrok_loader.py"
          $t = Get-Content -Raw $p

          if ($t -notmatch 'import sys') {
            $t = $t -replace 'import glob\r?\n', "import glob`nimport sys`n"
          }

          $oldDef = @'
def default_dll_path() -> str:
    here = os.path.dirname(os.path.abspath(__file__))
    for c in (
        os.path.join(here, "bedrok.dll"),
        os.path.join(os.getcwd(), "bedrok.dll"),
        os.path.join(here, "..", "dll", "build", "Release", "bedrok.dll"),
    ):
        p = os.path.normpath(c)
        if os.path.isfile(p):
            return p
    return os.path.join(here, "bedrok.dll")
'@

          $newDef = @'
def resource_path(name: str) -> str:
    base = getattr(sys, "_MEIPASS", None)
    if base:
        p = os.path.join(base, name)
        if os.path.isfile(p):
            return p
    here = os.path.dirname(os.path.abspath(__file__))
    p = os.path.join(here, name)
    if os.path.isfile(p):
        return p
    return os.path.join(os.getcwd(), name)

def ensure_bundled_dll() -> str:
    import hashlib, shutil
    src = resource_path("bedrok.dll")
    if not os.path.isfile(src):
        for c in (
            os.path.join(os.path.dirname(os.path.abspath(__file__)), "bedrok.dll"),
            os.path.join(os.getcwd(), "bedrok.dll"),
            os.path.normpath(os.path.join(os.path.dirname(os.path.abspath(__file__)), "..", "dll", "build", "Release", "bedrok.dll")),
        ):
            if os.path.isfile(c):
                src = c
                break
        else:
            raise FileNotFoundError("bedrok.dll missing from this build")
    dest_dir = os.path.join(os.environ.get("LOCALAPPDATA") or os.environ.get("TEMP") or ".", "bedROK")
    os.makedirs(dest_dir, exist_ok=True)
    dest = os.path.join(dest_dir, "bedrok.dll")
    def _sha(path):
        h = hashlib.sha256()
        with open(path, "rb") as f:
            for chunk in iter(lambda: f.read(65536), b""):
                h.update(chunk)
        return h.hexdigest()
    need = True
    if os.path.isfile(dest):
        try:
            need = _sha(src) != _sha(dest)
        except Exception:
            need = True
    if need:
        shutil.copy2(src, dest)
    return dest
