name: Build bedROK

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure and build DLL
        working-directory: dll
        run: |
          cmake -B build -A x64
          cmake --build build --config Release

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build loader exe
        working-directory: loader
        run: |
          pip install -r requirements.txt pyinstaller
          pyinstaller --noconfirm --onefile --windowed --name bedrok_loader bedrok_loader.py

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bedrok-windows
          path: |
            dll/build/Release/bedrok.dll
            loader/dist/bedrok_loader.exe

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.1.0' }}
          name: bedROK ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.1.0' }}
          body: |
            ## bedROK v1.1.0

            Cleaner injector UI + auto-detect Minecraft Bedrock.

            ### Files
            - `bedrok_loader.exe` — injector (auto-finds Minecraft + DLL)
            - `bedrok.dll` — companion DLL

            ### Loader
            - Dark compact UI
            - Auto-detects `Minecraft.Windows.exe`
            - Auto-picks `bedrok.dll` next to the exe
            - Launch MC button + continuous rescan
            - One-click Inject

            ### Modules (hotkeys)
            - F1 Fullbright · F2 Crosshair · F3 Clock · F4 Array list · F5 Watermark

            ### Use
            1. Put `bedrok.dll` next to `bedrok_loader.exe`
            2. Start Minecraft (or press Launch MC)
            3. Run loader → Inject
            4. Log: `C:\Users\Public\bedrok.log`
          files: |
            dll/build/Release/bedrok.dll
            loader/dist/bedrok_loader.exe
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
