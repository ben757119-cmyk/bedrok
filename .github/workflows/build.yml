name: Build bedROK

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore full loader source
        shell: bash
        run: |
          git show 4cfa6a19a13788107927d3559415f7d4cc126111:loader/bedrok_loader.py > loader/bedrok_loader.py
          wc -l loader/bedrok_loader.py

      - name: Prefer embedded DLL path (sys._MEIPASS)
        shell: python
        run: |
          from pathlib import Path
          p = Path("loader/bedrok_loader.py")
          t = p.read_text(encoding="utf-8")
          if "import sys" not in t:
              t = t.replace("import glob\n", "import glob\nimport sys\n")
          needle = "def default_dll_path() -> str:\n    here = os.path.dirname(os.path.abspath(__file__))\n"
          insert = (
              "def default_dll_path() -> str:\n"
              "    # Prefer DLL embedded inside the onefile exe\n"
              "    base = getattr(sys, \"_MEIPASS\", None)\n"
              "    if base:\n"
              "        emb = os.path.join(base, \"bedrok.dll\")\n"
              "        if os.path.isfile(emb):\n"
              "            return emb\n"
              "    here = os.path.dirname(os.path.abspath(__file__))\n"
          )
          if needle in t:
              t = t.replace(needle, insert, 1)
          p.write_text(t, encoding="utf-8")
          print("patched", p.stat().st_size)

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure and build DLL
        working-directory: dll
        run: |
          cmake -B build -A x64
          cmake --build build --config Release

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build loader exe with embedded DLL
        working-directory: loader
        shell: pwsh
        run: |
          Copy-Item ..\dll\build\Release\bedrok.dll .\bedrok.dll -Force
          pip install -r requirements.txt pyinstaller
          pyinstaller --noconfirm --onefile --windowed --name bedrok_loader --add-data "bedrok.dll;." bedrok_loader.py

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bedrok-windows
          path: loader/dist/bedrok_loader.exe

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.4.0' }}
          name: bedROK ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.4.0' }}
          body: |
            ## bedROK v1.4.0

            **One file only:** `bedrok_loader.exe`

            `bedrok.dll` is **embedded** in the exe (PyInstaller).
            You do not need a separate DLL next to the loader.

            ### Use
            1. Download `bedrok_loader.exe`
            2. Start Minecraft Bedrock
            3. Run the loader → Inject
          files: |
            loader/dist/bedrok_loader.exe
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
