name: Build bedROK

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure and build DLL
        working-directory: dll
        run: |
          cmake -B build -A x64
          cmake --build build --config Release

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build loader exe
        working-directory: loader
        run: |
          pip install -r requirements.txt pyinstaller
          pyinstaller --noconfirm --onefile --windowed --name bedrok_loader bedrok_loader.py

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bedrok-windows
          path: |
            dll/build/Release/bedrok.dll
            loader/dist/bedrok_loader.exe

      - name: Create GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dll/build/Release/bedrok.dll
            loader/dist/bedrok_loader.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
