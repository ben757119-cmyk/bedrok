      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure and build DLL
        working-directory: dll
        run: |
          cmake -B build -A x64
          cmake --build build --config Release

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build loader exe (DLL embedded)
        working-directory: loader
        shell: pwsh
        run: |
          Copy-Item ..\dll\build\Release\bedrok.dll .\bedrok.dll -Force
          pip install -r requirements.txt pyinstaller
          pyinstaller --noconfirm --onefile --windowed --name bedrok_loader --add-data "bedrok.dll;." bedrok_loader.py

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bedrok-windows
          path: |
            loader/dist/bedrok_loader.exe

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.4.0' }}
          name: bedROK ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.4.0' }}
          body: |
            ## bedROK v1.4.0

            **Single EXE** — `bedrok.dll` is built into the loader.
            No separate DLL download, no browse path for other DLLs.

            ### Use
            1. Download `bedrok_loader.exe` only
            2. Start Minecraft Bedrock
            3. Run loader → Inject

            Payload shows as **bedrok.dll · locked in this build**.
          files: |
            loader/dist/bedrok_loader.exe
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
